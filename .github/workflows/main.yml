name: 'CI/CD'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install JSHint
        run: npm install jshint --global
      - name: Run Linter
        run: |
          find ./giftlink-backend -name "*.js" -not -path "*/node_modules/*" -print0 | xargs -0 jshint

  client_build:
    name: Build client
    runs-on: ubuntu-latest
    needs: lint_js
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
        working-directory: giftlink-frontend
      - name: Build client
        run: npm run build
        working-directory: giftlink-frontend
        env:
          CI: false
