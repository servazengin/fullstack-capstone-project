<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftLink Home</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            background: linear-gradient(135deg, #1e3c72, #2a5298, #6a82fb);
        }
        h1, h2 { text-shadow: 1px 1px 4px rgba(0,0,0,0.4); }
        .btn-primary {
            background-color: #ff7f50;
            border-color: #ff7f50;
            border-radius: 30px;
            padding: 12px 36px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="text-center">
            <h1 class="my-4 display-4 font-weight-bold">Welcome to GiftLink</h1>
            <h2 class="my-3">Share and Discover Gifts in Your Community</h2>
            <blockquote class="blockquote my-4">
                <p class="mb-0">The best gift is the one that comes from the heart.</p>
            </blockquote>
            <a href="#" class="btn btn-primary btn-lg">Get Started</a>
        </div>
    </div>
</body>
</html>
